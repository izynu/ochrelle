<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Ochrelle banner: 28 Agent Skills for interface art direction">
  <title>Ochrelle - Give AI a design sense.</title>
  <desc>Animated banner: a row of earth-pigment chips rises into place beneath the Ochrelle wordmark. Motion is decorative and disabled when reduced motion is requested.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFAF9"/>
      <stop offset="1" stop-color="#F3F1EF"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1C1917" opacity="0.055"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2410C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C2410C"/>
      <stop offset="1" stop-color="#C2410C" stop-opacity="0"/>
    </linearGradient>
    <style>
      .wordmark { font: 700 92px/1 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1C1917; letter-spacing: -2px; }
      .tagline  { font: 400 30px/1.4 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #57534E; letter-spacing: 0.2px; }
      .caption  { font: 600 19px/1 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #57534E; letter-spacing: 2.5px; }
      .chipLabel{ font: 600 11px/1 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #57534E; letter-spacing: 1.2px; }
      .chip { transform: translateY(26px); opacity: 0; animation: rise 7s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .sweep { animation: sweep 7s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      .glow { animation: glow 7s ease-in-out infinite; }
      @keyframes rise {
        0%   { transform: translateY(26px); opacity: 0; }
        8%   { transform: translateY(0);    opacity: 1; }
        82%  { transform: translateY(0);    opacity: 1; }
        96%  { transform: translateY(-4px); opacity: 0.15; }
        100% { transform: translateY(26px); opacity: 0; }
      }
      @keyframes sweep {
        0%, 10% { transform: translateX(-560px); opacity: 0; }
        22%     { transform: translateX(0);      opacity: 1; }
        72%     { transform: translateX(0);      opacity: 1; }
        88%,100%{ transform: translateX(560px);  opacity: 0; }
      }
      @keyframes glow {
        0%, 10% { opacity: 0.25; }
        30%     { opacity: 1; }
        80%     { opacity: 1; }
        100%    { opacity: 0.25; }
      }
      @media (prefers-reduced-motion: reduce) {
        .chip, .sweep, .glow { animation: none; }
        .chip { transform: translateY(0); opacity: 1; }
        .sweep { transform: translateX(0); opacity: 1; }
        .glow { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="480" fill="url(#paper)"/>
  <rect width="1200" height="480" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#C2410C"/>
  <rect x="0" y="474" width="1200" height="6" fill="#1C1917"/>

  <!-- wordmark block -->
  <g>
    <text class="wordmark" x="600" y="196" text-anchor="middle">Ochrelle</text>
    <rect class="sweep" x="440" y="222" width="320" height="7" rx="3.5" fill="url(#sweep)"/>
    <text class="tagline" x="600" y="286" text-anchor="middle">Give AI a design sense.</text>
  </g>

  <!-- pigment chips: 9 earth tones, staggered rise -->
  <g>
    <g class="chip" style="animation-delay: 0.00s">
      <rect x="266" y="316" width="60" height="80" rx="10" fill="#C2410C"/>
      <rect x="266" y="316" width="60" height="80" rx="10" fill="none" stroke="#1C1917" stroke-opacity="0.14"/>
      <text class="chipLabel" x="296" y="418" text-anchor="middle">BURNT</text>
    </g>
    <g class="chip" style="animation-delay: 0.18s">
      <rect x="360" y="316" width="60" height="80" rx="10" fill="#B45309"/>
      <rect x="360" y="316" width="60" height="80" rx="10" fill="none" stroke="#1C1917" stroke-opacity="0.14"/>
      <text class="chipLabel" x="390" y="418" text-anchor="middle">SIENNA</text>
    </g>
    <g class="chip" style="animation-delay: 0.36s">
      <rect x="454" y="316" width="60" height="80" rx="10" fill="#C9932B"/>
      <rect x="454" y="316" width="60" height="80" rx="10" fill="none" stroke="#1C1917" stroke-opacity="0.14"/>
      <text class="chipLabel" x="484" y="418" text-anchor="middle">OCHRE</text>
    </g>
    <g class="chip" style="animation-delay: 0.54s">
      <rect x="548" y="316" width="60" height="80" rx="10" fill="#A16207"/>
      <rect x="548" y="316" width="60" height="80" rx="10" fill="none" stroke="#1C1917" stroke-opacity="0.14"/>
      <text class="chipLabel" x="578" y="418" text-anchor="middle">UMBER</text>
    </g>
    <g class="chip" style="animation-delay: 0.72s">
      <rect x="642" y="316" width="60" height="80" rx="10" fill="#8A5A2B"/>
      <rect x="642" y="316" width="60" height="80" rx="10" fill="none" stroke="#1C1917" stroke-opacity="0.14"/>
      <text class="chipLabel" x="672" y="418" text-anchor="middle">RAW UMBER</text>
    </g>
    <g class="chip" style="animation-delay: 0.90s">
      <rect x="736" y="316" width="60" height="80" rx="10" fill="#92400E"/>
      <rect x="736" y="316" width="60" height="80" rx="10" fill="none" stroke="#1C1917" stroke-opacity="0.14"/>
      <text class="chipLabel" x="766" y="418" text-anchor="middle">RUSSET</text>
    </g>
    <g class="chip" style="animation-delay: 1.08s">
      <rect x="830" y="316" width="60" height="80" rx="10" fill="#78350F"/>
      <rect x="830" y="316" width="60" height="80" rx="10" fill="none" stroke="#1C1917" stroke-opacity="0.14"/>
      <text class="chipLabel" x="860" y="418" text-anchor="middle">SEPIA</text>
    </g>
    <g class="chip" style="animation-delay: 1.26s">
      <rect x="924" y="316" width="60" height="80" rx="10" fill="#57534E"/>
      <rect x="924" y="316" width="60" height="80" rx="10" fill="none" stroke="#1C1917" stroke-opacity="0.14"/>
      <text class="chipLabel" x="954" y="418" text-anchor="middle">STONE</text>
    </g>
  </g>

  <!-- caption -->
  <g class="glow">
    <text class="caption" x="600" y="452" text-anchor="middle">28 AGENT SKILLS&#160;&#160;&#183;&#160;&#160;1 MASTER + 27 SPECIALISTS&#160;&#160;&#183;&#160;&#160;MIT</text>
  </g>
</svg>
