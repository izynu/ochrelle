# Ochrelle CI: runs the validators and the unit-test suite on every push/PR to main.
#
# Note: validate_skills.py intentionally fails the build while skill content is
# incomplete (missing SKILL.md files, unresolved references, placeholders).
# The workflow turns green only when the repository satisfies its own rules.

name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Agent Skills
        run: python scripts/validate_skills.py

      - name: Validate repository structure
        run: python scripts/validate_repository.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
